<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 9 | Vocabulary Studio</title><style>:root{font-family:system-ui,Arial;color:#18334a;background:#f2f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#13375d,#167a94);color:white;padding:28px max(20px,calc((100vw - 1050px)/2))}h1{margin:4px 0}header p{margin:5px 0}.shell{max-width:1050px;margin:auto;padding:20px}.top{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:14px 0}.top input{padding:12px;border:1px solid #b8d0dc;border-radius:9px;flex:1;min-width:180px}.bar{background:#d9e6ed;border-radius:20px;height:14px;overflow:hidden;flex:2;min-width:150px}.fill{background:#21b08d;height:100%;width:0;transition:.3s}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.nav button{padding:10px 15px;border:1px solid #a8c8d6;background:white;color:#234b60;border-radius:10px;cursor:pointer}.nav button.active{background:#155b79;color:white}.panel{background:white;padding:25px;border-radius:16px;box-shadow:0 6px 22px #153a5812}.intro{background:#eaf6fa;border-left:4px solid #16849a;padding:14px;border-radius:8px;line-height:1.8}.question{border-bottom:1px solid #e5eef2;padding:17px 0}.question p{font-weight:600;margin:0 0 10px;line-height:1.6}.opts{display:flex;gap:9px;flex-wrap:wrap}.opts label{border:1px solid #c8d9e3;padding:10px 13px;border-radius:10px;cursor:pointer;background:#fff}.opts label:has(input:checked){background:#e1f2ff;border-color:#247da5}input[type=text],textarea{padding:10px;border:1px solid #adc8d6;border-radius:8px;font:inherit;max-width:100%;width:300px}textarea{width:100%;min-height:180px}.feedback{font-size:.92rem;margin-top:8px;font-weight:600}.correct{color:#08764f}.wrong{color:#b04439}button.action{border:0;background:#176d89;color:white;border-radius:10px;padding:12px 19px;cursor:pointer;font-weight:700;margin:15px 8px 0 0}button.secondary{background:#e4eef3;color:#24566d}.muted{color:#627989}.photo{width:100%;max-width:730px;border-radius:12px;margin:16px 0}footer{text-align:center;padding:30px;color:#567} @media(max-width:600px){.panel{padding:15px}}</style></head><body><header><small>LEVEL 1 FOUNDATION 1 · ROADMAP A1</small><h1>Unit 9 Vocabulary Studio</h1><p>Read · Practise · Check · Improve</p></header><main class="shell"><div class="top"><input id="student" placeholder="Your name (optional)" aria-label="Student name"><div class="bar"><div class="fill" id="fill"></div></div><strong id="progress">0 / 12 completed</strong></div><nav class="nav" id="nav"></nav><section class="panel" id="panel"></section></main><footer>Based on Unit 9 Vocabulary Practice · Your work is saved in this browser.</footer><script>
const reading=`On Saturday, Mia and Leo visit a community centre. There is a notice board between two windows. Above the board, there is a clock. Below it, there is a small table. A man is standing behind the table with some family photos. He can tell a story about every photo.\n\nThe centre has different activities. Mia likes painting, and Leo likes cycling. Next month, they want to go camping together. They also want to go sightseeing in a nearby town. There is a sightseeing tour on Sunday. Outside the centre, some young people go skateboarding. These activities are good entertainment. There is also an entertaining show in the evening.\n\nAfter lunch, Mia and Leo study in a quiet room. Mia uses a dictionary to check new words. Leo does online practice, and they both do homework. They take a short break after an hour. Leo writes new words in a notebook to remember them. “I sometimes fail a test,” he says, “but I study again and ask for help.” At four o’clock, they feel hungry and go home for a meal.`;
const sections=[
{title:'A · Words in context',intro:'Read the text, then answer the questions.',reading,qs:[['The notice board is between two windows.','T','T','F'],['Mia and Leo want to go camping next month.','T','T','F'],['The sightseeing tour is on Saturday.','F','T','F'],['Leo never studies again after a bad test result.','F','T','F'],['Find the word: Needing food','hungry'],['Find the word: Something enjoyable to watch or do','entertainment'],['Find the word: A book that explains words','dictionary']]},
{title:'B · Match the meanings',intro:'Choose the correct meaning for each word.',qs:[['camping','staying in a tent for a holiday','not pass a test','riding a bicycle','staying in a tent for a holiday'],['cycling','riding a bicycle','riding a bicycle','visiting interesting places','physical activity'],['sightseeing','visiting interesting places as a tourist','visiting interesting places as a tourist','staying in a tent','moving on a board'],['skateboarding','moving on a small board with wheels','moving on a small board with wheels','riding a bicycle','painting pictures'],['remember','keep something in your mind','keep something in your mind','not pass a test','take a break'],['fail','not pass a test','keep something in mind','not pass a test','do exercise'],['board','a flat surface for writing or putting notices on','a flat surface for writing or putting notices on','a dictionary','a test'],['exercise','physical activity to keep your body healthy','a painting','a test','physical activity to keep your body healthy']]},
{title:'C · Choose the correct word',qs:[['I do not know this word. I can use a _____.','dictionary','dictionary','painting','story'],['The bus stop is _____ the bank and the café.','between','behind','between','above'],['My name is on line 3; yours is on line 2. Mine is ____ yours.','below','above','between','below'],['The children cannot see the dog. It is _____ the big tree.','behind','behind','above','between'],['The photo is _____ the sofa, high on the wall.','above','below','above','behind'],['We have not eaten all day. We are very _____.','hungry','entertaining','hungry','cycling']]},
{title:'D · Find the different activity',intro:'Choose the different phrase.',qs:[['Activities with wheels','painting','cycling','skateboarding','painting'],['Activities usually done outside','do online practice','camping','cycling','do online practice'],['Study activities','go sightseeing','use a dictionary','do homework','go sightseeing']]},
{title:'E · Choose the correct form',intro:'Choose the correct form of each word.',qs:[['The funny film is _____.','entertaining','entertain','entertaining'],['The hotel has music and other _____ every night.','entertainment','entertainment','entertain'],['These games can _____ children on a long journey.','entertain','entertain','entertainment'],['We _____ to work every morning.','cycle','cycle','cycling'],['My favourite weekend activity is _____.','cycling','cycling','cycle'],['I want to _____ a picture of the sea.','paint','paint','painting'],['This _____ is by a local artist.','painting','painting','paint'],['I do not want to _____ my driving test.','fail','fail','failure'],['One _____ is not the end. You can try again.','failure','failure','fail']]},
{title:'F · Complete the phrases',intro:'Word box: do · feel · go · notice · sightseeing · tell · use. Use each word once.',qs:[['_____ a story','tell'],['_____ some exercise','do'],['_____ a dictionary','use'],['_____ hungry','feel'],['a _____ board','notice'],['a _____ tour','sightseeing'],['_____ camping','go']]},
{title:'G · Choose the correct partner',qs:[['_____ homework','do','do','make'],['_____ skateboarding','go','go','do'],['cycle _____ work','to','at','to'],['_____ online practice','do','do','tell'],['_____ cycling','go','go','take']]},
{title:'H · Complete the message',intro:'Word box: dictionary · entertainment · exercise · hungry · painting · remember · story. One word is extra.',reading:'Hi Sam,\nOur holiday club starts tomorrow, so please (1) _____ to bring your bag and a bottle of water. In the morning, we do some (2) _____ in the park to keep our bodies healthy. Lunch is at twelve, so bring a snack if you get (3) _____ before then and need something to eat. After lunch, an artist helps us with (4) _____ in the art room, using brushes and bright colours. Later, a visitor tells us a (5) _____ about an exciting trip across the mountains with her family. There is music and other (6) _____ in the evening for everyone to enjoy before going home.\nSee you there!\nAli',qs:[['Blank (1)','remember'],['Blank (2)','exercise'],['Blank (3)','hungry'],['Blank (4)','painting'],['Blank (5)','story'],['Blank (6)','entertainment'],['The club includes physical activity.','T','T','F'],['The art activity is in the morning.','F','T','F']]},
{title:'I · Complete the sentences',intro:'Word box: behind · below · board · fail · take. Use each word once.',qs:[['The test results are on the notice _____ near the classroom door.','board'],['Please _____ your notebook to the library.','take'],['I cannot see the car because it is _____ a tall wall.','behind'],['The temperature is two degrees _____ zero.','below'],['If you do not get enough correct answers, you may _____ the test.','fail']]},
{title:'J · Check the vocabulary',intro:'Replace the wrong word. Word box: do · go · tell · use.',qs:[['Can you MAKE a story about your first day at school?','tell'],['We PLAY camping in the summer.','go'],['I MAKE online practice after every lesson.','do'],['Please WATCH a dictionary to check the meaning.','use']]},
{title:'K · Choose useful vocabulary',intro:'Select ALL phrases that help describe the picture.',photo:true,qs:[['Which words and phrases describe the picture?','painting|use a dictionary|notice board|behind|above|below','painting','use a dictionary','notice board','behind','go camping','above','below','go skateboarding']]},
{title:'L · Describe and imagine',intro:'Write 5–6 sentences. Describe the picture first, then imagine hobbies and study habits. Use at least six Unit 9 words or phrases. Use “I imagine” for details that are not visible.',photo:true,writing:true,qs:[]}
];
const key='unit9-vocab-progress-v1';let state={};try{state=JSON.parse(localStorage.getItem(key))||{}}catch{}let current=0;const save=()=>localStorage.setItem(key,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const getAnswers=()=>state[current]?.answers||{};
function render(){const s=sections[current];document.getElementById('nav').innerHTML=sections.map((x,i)=>`<button class="${i===current?'active':''}" onclick="openSection(${i})">${x.title.split(' · ')[0]} ${state[i]?.completed?'✓':''}</button>`).join('');let html=`<h2>${esc(s.title)}</h2><p class="muted">${esc(s.intro||'Choose the best answer.')}</p>`;if(s.reading)html+=`<div class="intro" style="white-space:pre-line">${esc(s.reading)}</div>`;if(s.photo)html+=`<img class="photo" src="picture.png" alt="People painting and studying in a room with a notice board">`;if(s.writing){html+=`<p>Ideas: Where is the board? What is below the table? What activities can you see? How might these people study?</p><textarea id="writing" placeholder="I can see...">${esc(state[current]?.writing||'')}</textarea><p class="muted">Self-check: 5–6 sentences · six target words or phrases · picture details · imagined details clearly marked.</p><button class="action" onclick="saveWriting()">Save my writing</button>`}else{s.qs.forEach((q,i)=>{const ans=getAnswers()[i]|| (q.length>2&&current===10?[]:'');const multiple=current===10;html+=`<div class="question"><p>${i+1}. ${esc(q[0])}</p>`;if(q.length===2){html+=`<input type="text" data-i="${i}" value="${esc(ans)}" placeholder="Type your answer" oninput="changeText(${i},this.value)">`}else{html+=`<div class="opts">${q.slice(2).map(opt=>`<label><input type="${multiple?'checkbox':'radio'}" name="q${i}" ${multiple?`onchange="changeMulti(${i},'${esc(opt)}',this.checked)"`:`onchange="changeText(${i},'${esc(opt)}')"`} ${multiple?(Array.isArray(ans)&&ans.includes(opt)?'checked':''):(ans===opt?'checked':'')}> ${esc(opt)}</label>`).join('')}</div>`}if(state[current]?.checked){const good=multiple?Array.isArray(ans)&&ans.slice().sort().join('|')===q[1].split('|').sort().join('|'):String(ans).trim().toLowerCase()===q[1].toLowerCase();html+=`<div class="feedback ${good?'correct':'wrong'}">${good?'✓ Correct!':'✗ Try again.'}${!good&&state[current].reveal?' Correct answer: '+esc(q[1].replaceAll('|',', ')):''}</div>`}html+='</div>'});html+=`<button class="action" onclick="check()">Check answers</button><button class="action secondary" onclick="retry()">Try again</button><button class="action secondary" onclick="reveal()">Show answer key</button>`;if(state[current]?.checked)html+=`<p><strong>Score: ${state[current].score} / ${s.qs.length}</strong></p>`}html+=`<div style="margin-top:24px"><button class="action secondary" onclick="openSection(Math.max(0,current-1))">← Previous</button><button class="action" onclick="openSection(Math.min(11,current+1))">Next →</button></div>`;document.getElementById('panel').innerHTML=html;updateProgress()}
function ensure(){state[current]??={answers:{}};state[current].answers??={}}function changeText(i,v){ensure();state[current].answers[i]=v;state[current].checked=false;save()}function changeMulti(i,opt,on){ensure();let a=state[current].answers[i]||[];a=on?[...new Set([...a,opt])]:a.filter(x=>x!==opt);state[current].answers[i]=a;state[current].checked=false;save()}function check(){ensure();let s=sections[current],a=state[current].answers;let score=s.qs.reduce((n,q,i)=>n+(current===10?Array.isArray(a[i])&&a[i].slice().sort().join('|')===q[1].split('|').sort().join('|'):String(a[i]||'').trim().toLowerCase()===q[1].toLowerCase()?1:0),0);state[current].score=score;state[current].checked=true;state[current].completed=true;save();render()}function retry(){ensure();state[current].checked=false;state[current].reveal=false;save();render()}function reveal(){ensure();state[current].checked=true;state[current].reveal=true;save();render()}function saveWriting(){ensure();let t=document.getElementById('writing').value;state[current].writing=t;state[current].completed=t.trim().length>0;save();render();alert('Writing saved in this browser.')}function openSection(i){current=i;render();window.scrollTo({top:0,behavior:'smooth'})}function updateProgress(){let n=sections.filter((_,i)=>state[i]?.completed).length;document.getElementById('progress').textContent=`${n} / 12 completed`;document.getElementById('fill').style.width=`${n/12*100}%`}document.getElementById('student').value=localStorage.getItem('unit9-student')||'';document.getElementById('student').addEventListener('input',e=>localStorage.setItem('unit9-student',e.target.value));render();
</script></body></html>
